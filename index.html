<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Hunters</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111b22;
      color: #f7f0dd;
      font: 1rem/1.5 Inter, system-ui, sans-serif;
    }

    main {
      max-width: 48rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 3rem);
    }

    h1 {
      margin: 0 0 0.75rem;
      color: #ffd16d;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
    }

    #board {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #54706a;
      background: #234b37;
    }

    .skins {
      margin-top: 1.25rem;
    }

    .skins h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    .skin-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .skin-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem;
      border: 2px solid #54706a;
      border-radius: 0.5rem;
      background: #203830;
      color: inherit;
      font: 600 0.875rem/1.3 Inter, system-ui, sans-serif;
      cursor: pointer;
    }

    .skin-option canvas {
      display: block;
      width: 4.5rem;
      max-width: 100%;
      height: auto;
    }

    .skin-option:hover {
      background: #2c473c;
    }

    .skin-option[aria-pressed='true'] {
      border-color: #ffd16d;
      background: #344437;
      color: #ffd16d;
    }

    .skin-option:focus-visible {
      outline: 2px solid #f7f0dd;
      outline-offset: 2px;
    }

    @media (max-width: 36rem) {
      .skin-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    kbd {
      display: inline-block;
      min-width: 1.5em;
      padding: 0 0.2em;
      border: 1px solid #687d83;
      border-radius: 0.25rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Coin Hunters</h1>
    <p id="controls">
      Poruszaj postacią za pomocą <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> lub strzałek.
    </p>
    <canvas id="board" width="640" height="384" aria-label="Mapa parku jurajskiego" aria-describedby="controls">
      Twoja przeglądarka nie obsługuje elementu Canvas.
    </canvas>
    <section class="skins" aria-labelledby="skins-title">
      <h2 id="skins-title">Wybierz skórkę</h2>
      <div class="skin-options">
        <button class="skin-option" type="button" data-skin="wolf" aria-pressed="true">
          <canvas width="128" height="128" aria-hidden="true"></canvas>
          Wilk
        </button>
        <button class="skin-option" type="button" data-skin="duck" aria-pressed="false">
          <canvas width="128" height="128" aria-hidden="true"></canvas>
          Pan Kaczor w stroju dinozaura
        </button>
        <button class="skin-option" type="button" data-skin="bear" aria-pressed="false">
          <canvas width="128" height="128" aria-hidden="true"></canvas>
          Misiu w garniturze
        </button>
        <button class="skin-option" type="button" data-skin="dinosaur" aria-pressed="false">
          <canvas width="128" height="128" aria-hidden="true"></canvas>
          Dinozaur w stroju słonia
        </button>
      </div>
    </section>
  </main>

  <script>
    const board = document.querySelector('#board');
    const context = board.getContext('2d');

    const worldWidth = 1280;
    const worldHeight = 768;
    const playerSpeed = 180; // Piksele na sekundę. Zmień tę liczbę i odśwież grę.
    const playerSize = 28;
    const player = { x: 146, y: 370 };

    // Położenia obiektów na mapie są podane w pikselach świata.
    const trees = [ // x, y i promień korony
      [28, 82, 43], [110, 45, 48], [191, 102, 42], [270, 70, 46], [348, 113, 35],
      [418, 58, 44], [501, 122, 48], [579, 56, 39], [706, 84, 46], [807, 116, 40],
      [1107, 58, 47], [1190, 116, 49], [1252, 44, 37],
      [42, 228, 46], [130, 264, 36], [207, 215, 48], [307, 270, 45], [384, 223, 39],
      [478, 269, 48], [542, 208, 41], [754, 284, 43], [841, 251, 36],
      [1009, 275, 46], [1106, 233, 45], [1217, 273, 48],
      [48, 509, 48], [138, 470, 40], [212, 531, 47], [306, 478, 41], [390, 540, 46],
      [476, 480, 44], [543, 532, 39], [766, 474, 39], [850, 505, 47],
      [955, 487, 38], [1066, 470, 42], [1166, 507, 48], [1260, 470, 41],
      [32, 698, 44], [119, 656, 47], [213, 728, 43], [309, 660, 49], [400, 720, 44],
      [481, 663, 38], [575, 730, 48], [724, 697, 45], [813, 735, 42],
      [907, 708, 46], [1024, 730, 47], [1120, 680, 40], [1240, 711, 48],
    ];
    const thickets = [
      { x: 0, y: 294, w: 152, h: 32 }, { x: 197, y: 293, w: 200, h: 32 },
      { x: 433, y: 291, w: 140, h: 34 }, { x: 550, y: 165, w: 34, h: 125 },
      { x: 714, y: 298, w: 180, h: 28 }, { x: 943, y: 297, w: 155, h: 28 },
      { x: 1130, y: 293, w: 150, h: 30 }, { x: 1057, y: 149, w: 83, h: 32 },
      { x: 0, y: 443, w: 110, h: 32 }, { x: 153, y: 443, w: 162, h: 34 },
      { x: 355, y: 443, w: 215, h: 33 }, { x: 551, y: 484, w: 32, h: 137 },
      { x: 712, y: 442, w: 141, h: 32 }, { x: 905, y: 443, w: 117, h: 29 },
      { x: 1060, y: 443, w: 220, h: 29 }, { x: 737, y: 657, w: 144, h: 28 },
      { x: 1115, y: 590, w: 34, h: 110 }, { x: 959, y: 676, w: 144, h: 28 },
    ];
    const rocks = [
      { x: 114, y: 399, w: 21, h: 14 }, { x: 355, y: 347, w: 25, h: 16 },
      { x: 525, y: 410, w: 26, h: 18 }, { x: 682, y: 462, w: 20, h: 22 },
      { x: 708, y: 246, w: 26, h: 16 }, { x: 868, y: 403, w: 32, h: 17 },
      { x: 1094, y: 343, w: 29, h: 20 }, { x: 1230, y: 402, w: 24, h: 21 },
      { x: 838, y: 619, w: 27, h: 20 }, { x: 1086, y: 620, w: 25, h: 20 },
      { x: 42, y: 574, w: 36, h: 23 }, { x: 455, y: 188, w: 34, h: 22 },
      { x: 1172, y: 557, w: 40, h: 28 }, { x: 795, y: 164, w: 26, h: 16 },
    ];
    const cabin = { x: 878, y: 58, w: 164, h: 104, wall: 12, doorWidth: 48 };
    const doorX = cabin.x + (cabin.w - cabin.doorWidth) / 2;
    const frontY = cabin.y + cabin.h - cabin.wall;
    const cabinWalls = [
      { x: cabin.x, y: cabin.y, w: cabin.w, h: cabin.wall },
      { x: cabin.x, y: cabin.y + cabin.wall, w: cabin.wall, h: cabin.h - cabin.wall },
      { x: cabin.x + cabin.w - cabin.wall, y: cabin.y + cabin.wall, w: cabin.wall, h: cabin.h - cabin.wall },
      { x: cabin.x + cabin.wall, y: frontY, w: doorX - cabin.x - cabin.wall, h: cabin.wall },
      { x: doorX + cabin.doorWidth, y: frontY, w: doorX - cabin.x - cabin.wall, h: cabin.wall },
    ];
    const trunks = trees.map(([x, y]) => ({ x: x - 8, y: y - 9, w: 16, h: 18 }));
    const obstacles = [...thickets, ...rocks, ...trunks, ...cabinWalls];

    const outlineColor = '#17222c';

    function drawShape(canvasContext, path, color, outlined = true) {
      const shape = new Path2D(path);
      canvasContext.fillStyle = color;
      canvasContext.fill(shape);
      if (outlined) canvasContext.stroke(shape);
    }

    function drawOval(canvasContext, x, y, radiusX, radiusY, color, outlined = false) {
      canvasContext.beginPath();
      canvasContext.ellipse(x, y, radiusX, radiusY, 0, 0, Math.PI * 2);
      canvasContext.fillStyle = color;
      canvasContext.fill();
      if (outlined) canvasContext.stroke();
    }

    function drawTree(art, x, y, radius) {
      drawOval(art, x + 8, y + 1, radius, radius * 0.62, '#254833');
      drawOval(art, x, y + 8, 13, 6, '#4c3c2d');
      drawOval(art, x, y - 1, 9, 12, '#654633');
      drawOval(art, x - 3, y + 3, 3, 6, '#a07449');
      drawOval(art, x, y - radius * 0.57, radius, radius * 0.66, '#21513c');
      drawOval(art, x - radius * 0.34, y - radius * 0.66, radius * 0.62, radius * 0.53, '#34734b');
      drawOval(art, x + radius * 0.36, y - radius * 0.78, radius * 0.58, radius * 0.48, '#316b47');
      drawOval(art, x - 4, y - radius * 0.92, radius * 0.58, radius * 0.46, '#3d8050');
      drawOval(art, x - 11, y - radius, radius * 0.27, radius * 0.14, '#589456');
    }

    function drawThicket(art, { x, y, w, h }) {
      art.fillStyle = '#204a35';
      art.fillRect(x, y, w, h);
      const horizontal = w > h;
      const length = horizontal ? w : h;
      const count = Math.ceil(length / 20);
      for (let i = 0; i < count; i++) {
        const distance = (i + 0.5) * length / count;
        const bushX = x + (horizontal ? distance : w / 2);
        const bushY = y + (horizontal ? h / 2 : distance);
        drawOval(art, bushX, bushY, horizontal ? 16 : w / 2 + 2, horizontal ? h / 2 + 2 : 16, '#2a6040');
        drawOval(art, bushX - 3, bushY - 4, 12, 10, i % 2 ? '#3a7546' : '#4a824a');
        drawOval(art, bushX - 6, bushY - 7, 5, 2, '#609253');
      }
    }

    function drawRock(art, { x, y, w, h }) {
      art.save();
      art.translate(x, y);
      art.scale(w / 28, h / 20);
      drawOval(art, 15, 17, 16, 6, '#284638');
      drawShape(art, 'M0 15 L4 5 L14 0 L24 4 L28 13 L24 19 L7 20 Z', '#6e8078');
      drawShape(art, 'M2 14 L6 6 L14 2 L22 5 L17 11 L7 14 Z', '#a4ad92', false);
      drawShape(art, 'M7 16 L17 12 L25 13 L22 17 L10 19 Z', '#526c61', false);
      art.restore();
    }

    function drawVine(art, x, y, length) {
      art.save();
      art.translate(x, y);
      art.lineWidth = 3;
      art.strokeStyle = '#243d28';
      art.beginPath();
      art.moveTo(0, 0);
      art.bezierCurveTo(-22, length * 0.26, 22, length * 0.56, -2, length);
      art.stroke();
      for (let i = 1; i < 6; i++) {
        const side = i % 2 ? 1 : -1;
        const offset = [-4, -3, 0, 3, 2][i - 1];
        art.save();
        art.translate(offset, i * length / 6);
        art.rotate(side * -0.65);
        drawOval(art, side * 5, 0, 8, 3.5, i % 2 ? '#8bb457' : '#638f46');
        art.restore();
      }
      art.restore();
    }

    function drawFossil(art, x, y) {
      art.save();
      art.translate(x, y);
      art.rotate(-0.18);
      const ribs = new Path2D('M-83 7 Q-48 -3 20 1');
      for (let i = 0; i < 6; i++) {
        const ribX = -47 + i * 10;
        const span = 12 + i * 2;
        ribs.moveTo(ribX - 8, -span);
        ribs.quadraticCurveTo(ribX + 7, -span * 0.7, ribX, 0);
        ribs.quadraticCurveTo(ribX + 8, span * 0.7, ribX - 5, span);
      }
      art.lineWidth = 8;
      art.strokeStyle = '#755b43';
      art.stroke(ribs);
      art.lineWidth = 5;
      art.strokeStyle = '#ead4a2';
      art.stroke(ribs);
      art.lineWidth = 2.5;
      art.strokeStyle = '#755b43';
      drawShape(art, 'M14 -5 Q14 -19 29 -22 Q40 -24 49 -14 L67 -9 Q73 -5 69 2 L62 5 L60 10 L55 6 L51 11 L47 6 L39 7 L32 14 L22 11 Z', '#f1deb3');
      drawShape(art, 'M25 -8 Q25 -15 34 -15 Q42 -14 39 -8 Q35 -3 28 -4 Z', '#755b43', false);
      drawOval(art, 59, -4, 4, 2, '#755b43');
      drawShape(art, 'M22 20 Q37 23 52 17 L57 18 Q56 25 36 28 L24 26 Z', '#ead4a2');
      drawShape(art, 'M-45 38 Q-51 33 -47 30 Q-43 26 -39 32 L-21 37 Q-16 33 -13 38 Q-11 44 -18 46 Q-21 46 -24 43 L-41 38 Q-43 42 -45 38 Z', '#ead4a2');
      art.restore();
    }

    function drawCabin(art) {
      const { x, y, w, h, wall, doorWidth } = cabin;
      art.fillStyle = '#8f7553';
      art.fillRect(x + 4, y + 6, w, h);
      art.fillStyle = '#b58355';
      art.fillRect(x, y, w, h);
      for (let row = y + wall; row < frontY; row += 9) {
        art.fillStyle = '#966742';
        art.fillRect(x + wall, row, w - 2 * wall, 1);
      }
      art.fillStyle = '#67503a';
      art.fillRect(x + 21, y + 22, 37, 13);
      art.fillRect(x + w - 52, y + 22, 31, 13);
      art.fillStyle = '#677c55';
      art.fillRect(x + 59, y + 39, 46, 30);
      art.strokeStyle = '#9a9b6b';
      art.lineWidth = 2;
      art.strokeRect(x + 63, y + 43, 38, 22);
      for (const { x, y, w, h } of cabinWalls) {
        art.fillStyle = '#583d31';
        art.fillRect(x, y, w, h);
        art.fillStyle = '#aa754a';
        art.fillRect(x + 2, y + 2, w - 4, h - 5);
      }
      art.fillStyle = '#e1b878';
      art.fillRect(doorX, y + h - 3, doorWidth, 7);
      drawOval(art, doorX - 6, frontY + 6, 3, 3, '#ffdc89');
      drawOval(art, doorX + doorWidth + 6, frontY + 6, 3, 3, '#ffdc89');
    }

    function createCabinRoof() {
      const roof = document.createElement('canvas');
      roof.width = cabin.w + 12;
      roof.height = cabin.h;
      const art = roof.getContext('2d');
      art.strokeStyle = '#342d29';
      art.lineWidth = 3;
      art.lineJoin = 'round';
      drawShape(art, 'M3 4 L88 1 L173 4 L169 95 L7 95 Z', '#765044');
      drawShape(art, 'M5 6 L88 3 L88 87 L9 88 Z', '#a76b4c', false);
      drawShape(art, 'M88 3 L171 6 L167 88 L88 87 Z', '#875343', false);
      art.strokeStyle = '#70483a';
      art.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const edgeY = 21 + 12 * i;
        const ridgeY = 14 + 12 * i;
        art.beginPath();
        art.moveTo(9, edgeY);
        art.lineTo(88, ridgeY);
        art.lineTo(168, edgeY);
        art.stroke();
      }
      art.fillStyle = '#c28659';
      art.fillRect(85, 4, 6, 84);
      art.fillStyle = '#513c35';
      art.fillRect(118, 39, 15, 18);
      art.fillStyle = '#ad826a';
      art.fillRect(117, 36, 17, 6);
      return roof;
    }

    function createMap() {
      const map = document.createElement('canvas');
      map.width = worldWidth;
      map.height = worldHeight;
      const art = map.getContext('2d');
      art.lineCap = 'round';
      art.lineJoin = 'round';
      art.strokeStyle = '#354138';
      art.lineWidth = 2;

      const ground = art.createLinearGradient(0, 0, worldWidth, worldHeight);
      ground.addColorStop(0, '#355d3e');
      ground.addColorStop(0.5, '#476a42');
      ground.addColorStop(1, '#31563a');
      art.fillStyle = ground;
      art.fillRect(0, 0, worldWidth, worldHeight);

      // Stałe ziarno daje ten sam układ trawy i żwiru przy każdym otwarciu gry.
      let seed = 7123;
      function random() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 2 ** 32;
      }
      for (let i = 0; i < 1150; i++) {
        const x = random() * worldWidth;
        const y = random() * worldHeight;
        drawOval(art, x, y, 2 + random() * 7, 1 + random() * 2, i % 2 ? '#537348' : '#2d573b');
      }

      const trails = new Path2D('M-65 384 C280 368 440 397 650 384 S1060 367 1345 385 M650 384 V229 Q650 204 676 204 H934 Q960 204 960 179 V154 M650 384 V560 Q650 589 680 589 H1000');
      drawOval(art, 1000, 585, 116, 73, '#6e7850');
      art.strokeStyle = '#6e7850';
      art.lineWidth = 116;
      art.stroke(trails);
      drawOval(art, 1000, 585, 109, 66, '#a99163');
      art.strokeStyle = '#a99163';
      art.lineWidth = 100;
      art.stroke(trails);
      drawOval(art, 1000, 585, 101, 59, '#bd9f70');
      art.strokeStyle = '#bd9f70';
      art.lineWidth = 87;
      art.stroke(trails);
      for (let i = 0; i < 1200; i++) {
        const x = random() * worldWidth;
        const y = random() * worldHeight;
        if (art.isPointInStroke(trails, x, y) || Math.hypot((x - 1000) / 99, (y - 585) / 56) < 1) {
          drawOval(art, x, y, 1 + random() * 3, 1, i % 2 ? '#ceb181' : '#a88d64');
        }
      }

      for (const thicket of thickets) drawThicket(art, thicket);
      for (const [x, y, radius] of trees) drawTree(art, x, y, radius);
      for (const [x, y, length] of [[34, 222, 74], [204, 211, 62], [480, 256, 75], [759, 265, 73], [1197, 261, 62], [211, 511, 74], [850, 478, 71], [1107, 57, 61]]) {
        drawVine(art, x, y - 23, length);
      }
      art.strokeStyle = '#354138';
      art.lineWidth = 2;
      for (const rock of rocks) drawRock(art, rock);
      drawFossil(art, 1001, 577);
      drawCabin(art);
      return map;
    }

    const map = createMap();
    const cabinRoof = createCabinRoof();

    function drawEyes(canvasContext, y) {
      drawOval(canvasContext, 24, y, 2.4, 3.5, outlineColor);
      drawOval(canvasContext, 40, y, 2.4, 3.5, outlineColor);
    }

    const drawSkin = {
      wolf(art) {
        // Korpus i ogon.
        drawShape(art, 'M39 53 Q52 54 56 45 Q62 49 58 56 Q53 62 41 59 Z', '#78899a');
        drawOval(art, 32, 51, 15, 11, '#78899a', true);
        drawOval(art, 32, 54, 8, 6, '#e9eef0');
        // Uszy są częścią konturu głowy.
        drawShape(art, 'M10 28 L9 8 Q9 4 13 6 L25 16 Q32 14 39 16 L51 6 Q55 4 55 8 L54 28 Q61 35 59 43 L54 42 Q48 52 32 52 Q16 52 10 42 L5 43 Q3 35 10 28 Z', '#9caebe');
        drawShape(art, 'M14 12 L21 19 L15 24 Z M50 12 L43 19 L49 24 Z', '#eaaab3', false);
        drawShape(art, 'M11 36 Q20 30 32 38 Q44 30 53 36 Q51 49 32 50 Q13 49 11 36 Z', '#e9eef0', false);
        drawEyes(art, 30);
        drawShape(art, 'M27 38 Q32 36 37 38 Q37 43 32 44 Q27 43 27 38 Z', outlineColor, false);
      },
      duck(art) {
        // Ogon, stopy i kolce zielonego kostiumu.
        drawShape(art, 'M39 51 Q53 53 59 45 Q60 56 48 59 L41 59 Z', '#4eb67c');
        drawOval(art, 23, 57, 7, 4, '#ffc343', true);
        drawOval(art, 42, 57, 7, 4, '#ffc343', true);
        drawOval(art, 32, 49, 17, 11, '#4eb67c', true);
        drawOval(art, 32, 51, 8, 7, '#bce779');
        drawShape(art, 'M15 18 Q13 13 16 9 Q20 9 24 12 Q23 5 28 3 Q33 4 35 11 Q40 4 45 6 Q47 9 45 15 Q51 11 55 15 Q55 20 51 24 Z', '#d6ee78');
        drawOval(art, 32, 29, 23, 19, '#4eb67c', true);
        drawOval(art, 32, 33, 17, 13, '#fff2d5', true);
        drawEyes(art, 29);
        drawShape(art, 'M21 39 Q26 34 32 36 Q38 34 43 39 Q46 45 34 47 Q22 47 21 42 Z', '#ffc343');
        drawShape(art, 'M24 41 Q33 44 41 40 Q35 46 24 42 Z', '#a55729', false);
      },
      bear(art) {
        drawShape(art, 'M12 56 Q12 43 24 41 L40 41 Q52 43 52 56 L50 61 L14 61 Z', '#304b78');
        drawShape(art, 'M21 44 L32 46 L43 44 L32 60 Z', '#fff1d8', false);
        drawShape(art, 'M30 46 L34 46 L35 55 L32 59 L29 55 Z', '#df515d', false);
        drawShape(art, 'M20 44 L28 56 L21 52 L17 47 Z M44 44 L36 56 L43 52 L47 47 Z', '#6483ae', false);
        drawOval(art, 14, 16, 9, 9, '#b97951', true);
        drawOval(art, 50, 16, 9, 9, '#b97951', true);
        drawOval(art, 14, 16, 4.5, 4.5, '#e9ae86');
        drawOval(art, 50, 16, 4.5, 4.5, '#e9ae86');
        drawOval(art, 32, 28, 23, 18, '#c98b61', true);
        drawOval(art, 32, 35, 12, 8, '#f2c796');
        drawEyes(art, 25);
        drawShape(art, 'M27 32 Q32 30 37 32 Q36 37 32 37 Q28 37 27 32 Z', outlineColor, false);
      },
      dinosaur(art) {
        // Zielony ogon wystaje spod szarego przebrania.
        drawShape(art, 'M39 50 Q47 52 52 50 L54 46 L56 48 L60 44 Q63 56 47 59 L40 58 Z', '#7ac56d');
        drawOval(art, 32, 51, 16, 11, '#9ba6bd', true);
        drawOval(art, 32, 54, 8, 6, '#cbd2e0');
        drawOval(art, 13, 24, 10, 15, '#9ba6bd', true);
        drawOval(art, 51, 24, 10, 15, '#9ba6bd', true);
        drawOval(art, 13, 24, 5, 10, '#edb2ca');
        drawOval(art, 51, 24, 5, 10, '#edb2ca');
        drawOval(art, 32, 24, 19, 19, '#b8c3d6', true);
        drawOval(art, 31, 34, 14, 12, '#7ac56d', true);
        drawOval(art, 25, 29, 2.4, 3.5, outlineColor);
        drawShape(art, 'M21 38 Q23 34 29 36 Q36 37 35 42 Q33 47 25 45 Q18 44 21 38 Z', '#b7e77f');
        drawOval(art, 24, 39, 1.4, 1.2, outlineColor);
        drawShape(art, 'M27 44 L32 44 L29 48 Z', '#fff2d5', false);
        drawShape(art, 'M39 19 Q46 17 48 25 L48 39 Q49 44 53 41 Q56 39 58 43 Q58 49 51 50 Q42 51 40 43 L38 27 Q36 21 39 19 Z', '#b8c3d6');
      },
    };

    let selectedButton = document.querySelector('.skin-option[aria-pressed="true"]');
    let playerSprite = selectedButton.querySelector('canvas');

    for (const button of document.querySelectorAll('.skin-option')) {
      const preview = button.querySelector('canvas');
      const art = preview.getContext('2d');
      // Rysunki mają współrzędne 64 × 64. Plansza korzysta z gotowego podglądu.
      art.scale(preview.width / 64, preview.height / 64);
      art.strokeStyle = outlineColor;
      art.lineWidth = 2.5;
      art.lineJoin = 'round';
      drawSkin[button.dataset.skin](art);

      button.addEventListener('click', () => {
        if (button === selectedButton) return;
        selectedButton.setAttribute('aria-pressed', 'false');
        button.setAttribute('aria-pressed', 'true');
        selectedButton = button;
        playerSprite = preview;
        narysujMape();
      });
    }

    const directions = {
      arrowleft: 'left', a: 'left',
      arrowright: 'right', d: 'right',
      arrowup: 'up', w: 'up',
      arrowdown: 'down', s: 'down',
    };
    const pressedKeys = new Set();

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (Object.hasOwn(directions, key) && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        pressedKeys.add(key);
      }
    });

    window.addEventListener('keyup', (event) => {
      pressedKeys.delete(event.key.toLowerCase());
    });

    window.addEventListener('blur', () => pressedKeys.clear());

    function pozycjaPoRuchu(axis, distance) {
      const horizontal = axis === 'x';
      const otherAxis = horizontal ? 'y' : 'x';
      const size = horizontal ? 'w' : 'h';
      const otherSize = horizontal ? 'h' : 'w';
      const limit = (horizontal ? worldWidth : worldHeight) - playerSize;
      const start = player[axis];
      const side = player[otherAxis];
      let end = Math.max(0, Math.min(start + distance, limit));

      // Zatrzymaj gracza na najbliższej krawędzi przeszkody na tej osi.
      for (const obstacle of obstacles) {
        if (side + playerSize <= obstacle[otherAxis] || side >= obstacle[otherAxis] + obstacle[otherSize]) continue;
        const near = obstacle[axis] - playerSize;
        const far = obstacle[axis] + obstacle[size];
        if (distance > 0 && start <= near) end = Math.min(end, near);
        if (distance < 0 && start >= far) end = Math.max(end, far);
      }
      return end;
    }

    function przesunPostac(seconds) {
      const activeDirections = new Set();
      for (const key of pressedKeys) {
        activeDirections.add(directions[key]);
      }

      let horizontal = Number(activeDirections.has('right')) - Number(activeDirections.has('left'));
      let vertical = Number(activeDirections.has('down')) - Number(activeDirections.has('up'));

      // Na skos postać pokonuje tę samą odległość co w poziomie lub w pionie.
      if (horizontal !== 0 && vertical !== 0) {
        horizontal /= Math.SQRT2;
        vertical /= Math.SQRT2;
      }

      if (horizontal !== 0) player.x = pozycjaPoRuchu('x', horizontal * playerSpeed * seconds);
      if (vertical !== 0) player.y = pozycjaPoRuchu('y', vertical * playerSpeed * seconds);
    }

    function narysujMape() {
      const centerX = player.x + playerSize / 2;
      const centerY = player.y + playerSize / 2;
      const cameraX = Math.round(Math.max(0, Math.min(centerX - board.width / 2, worldWidth - board.width)));
      const cameraY = Math.round(Math.max(0, Math.min(centerY - board.height / 2, worldHeight - board.height)));
      context.drawImage(map, cameraX, cameraY, board.width, board.height, 0, 0, board.width, board.height);
      context.drawImage(playerSprite, player.x - cameraX, player.y - cameraY, playerSize, playerSize);

      // Dach odsłania wnętrze, gdy środek postaci przekroczy próg.
      const insideCabin = centerX > cabin.x + cabin.wall && centerX < cabin.x + cabin.w - cabin.wall
        && centerY > cabin.y + cabin.wall && centerY < cabin.y + cabin.h;
      if (!insideCabin) context.drawImage(cabinRoof, cabin.x - 6 - cameraX, cabin.y - cameraY);
    }

    let previousTime;
    function aktualizujKlatke(time) {
      if (previousTime !== undefined) {
        const seconds = Math.min((time - previousTime) / 1000, 0.05);
        przesunPostac(seconds);
      }
      previousTime = time;
      narysujMape();
      requestAnimationFrame(aktualizujKlatke);
    }

    requestAnimationFrame(aktualizujKlatke);
  </script>
</body>
</html>
